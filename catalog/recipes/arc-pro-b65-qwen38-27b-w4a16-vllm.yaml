id: arc-pro-b65-qwen38-27b-w4a16-vllm
title: Serve the baked Qwen3.8-27B GPTQ-Int4 checkpoint with MTP k=6 on one Arc Pro B65
projects: [b65]
maturity: experimental
audience: developer
goal:
  provides: [openai_api, speculative_decoding, mtp, tool_calling]
  priorities: [throughput]
compatibility:
  architectures: [intel_arc]
  gpu_models: [arc_pro_b65]
  min_vram_gb: 32
  gpu_count: { min: 1, max: 1 }
  topology: single_gpu
  os: [ubuntu]
  os_versions: ["26.04"]
model:
  artifact: Launch80/Qwen3.8-27B-GPTQ-Int4-baked
  family: qwen3
  quantization: w4a16
  context_length: 32768
dependencies:
  required: [docker, intel_xe_driver]
steps:
  - id: preflight
    description: Find the B65's render node by PCI address. On a host with more than one Intel GPU, ZE_AFFINITY_MASK=0 alone can pick the wrong card.
    command: ls -l /dev/dri/by-path/ | grep render
    expected: A pci-<BDF>-render entry for the Arc Pro B65 (0000:86:00.0 on the author's box)
  - id: clone
    command: git clone https://github.com/launch80/B65 && cd B65 && git checkout 43e02c1
  - id: download_model
    command: huggingface-cli download Launch80/Qwen3.8-27B-GPTQ-Int4-baked --local-dir "$HOME/bake-model"
  - id: install
    command: docker pull vllm/vllm-openai-xpu@sha256:f01e24f6c7ff01f1e0662234255a1372297d1dbd89d003cf13c8fad3eab1ba4f
  - id: launch
    description: >
      Runs the MTP nightly, MTP boundary and GDN mixed-split patches plus the draft-vocab prefix
      patch, then vllm serve with GPTQ, fp16, fp8 KV, max-num-seqs 32 and MTP k=6. IMAGE pins the
      0.27.2 nightly the numbers were measured on (the script now defaults to 0.30.0).
      DFLASH_DIR works around the unbound $HERE in serve-baked.sh at this commit.
    command: >-
      IMAGE=vllm/vllm-openai-xpu@sha256:f01e24f6c7ff01f1e0662234255a1372297d1dbd89d003cf13c8fad3eab1ba4f
      BAKED="$HOME/bake-model" GPU_BDF=<your B65 PCI address> MAX_LEN=32768 SPEC=6 PORT=8002
      DFLASH_DIR="$PWD/patches" ./bake/serve-baked.sh
    expected: "Server log shows 'Detected MTP model. Sharing target model lm_head weights with the draft model.' and a 'P608-R6] draft head' line"
  - id: smoke_test
    description: Use a prompt longer than ~8 tokens; MTP produces garbage on very short prompts.
    command: >-
      curl -s localhost:8002/v1/chat/completions -H 'Content-Type: application/json'
      -d '{"model":"launch80/Qwen3.8-27B-GPTQ-Int4-baked","messages":[{"role":"user","content":"Count to five, one number per line."}],"max_tokens":24}'
    expected: A JSON chat.completion response
  - id: benchmark
    command: betterbench run --endpoint http://127.0.0.1:8002/v1 --model launch80/Qwen3.8-27B-GPTQ-Int4-baked --out betterbench-baked-r6on.json
    expected: Category-weighted single-stream decode around 71.8 tok/s
success_criteria:
  - Endpoint returns an OpenAI-compatible response
  - BetterBench weighted single-stream decode near 71.8 tok/s
rollback: docker rm -f vllm-baked
known_failures:
  - symptom: "serve-baked.sh exits immediately with 'HERE: unbound variable'"
    likely_causes: [DFLASH_DIR default references $HERE before it is set]
    fix: Set DFLASH_DIR (for example DFLASH_DIR="$PWD/patches") when launching.
  - symptom: "EngineCore dies under concurrent load: 'causal_conv1d does not support spec-decode and non-spec ... in the same invocation'"
    likely_causes: [GDN mixed-split patch not applied]
    fix: Keep SPEC non-zero so serve-baked.sh applies patch_gdn_mixed_split_v5.py.
  - symptom: Engine fails to start with "exceeds available Mamba cache blocks"
    likely_causes: [max_num_seqs left at vLLM's default of 256]
    fix: Use MAX_SEQS=32 (the script default).
  - symptom: logprobs or prompt_logprobs come back NaN
    likely_causes: [MTP speculative decoding enabled]
    fix: Run perplexity and other logprob checks with SPEC=0.
evidence:
  - b65-arc-pro-b65-qwen38-27b-baked-single
  - b65-arc-pro-b65-qwen38-27b-baked-conc8
verification:
  level: author_reported
  last_verified: "2026-09-08"
  last_commit_checked: 43e02c1
  tested_by: [launch80]
